name: "Сообщить о проблеме"
description: "Найденная ошибка в документации, оформлении или будущей реализации"
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Сейчас проект находится на стадии документации. Не сообщайте здесь сведения об уязвимостях или личные данные — см. SECURITY.md."
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Документация / спецификация
        - Визуальные материалы репозитория
        - Будущий веб-интерфейс (пока не реализован)
        - Другое
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Что не так?
      description: Суть проблемы и место, где вы её увидели
      placeholder: Ссылка на файл или раздел и описание проблемы
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Каким должен быть результат?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести или проверить?
      description: Шаги, устройство и ссылки, если применимо
  - type: checkboxes
    id: privacy
    attributes:
      label: Подтверждение
      options:
        - label: Сообщение не содержит секретов и подробностей уязвимости
          required: true
