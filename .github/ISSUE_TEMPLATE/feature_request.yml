name: "Предложить улучшение"
description: "Продуктовая идея или улучшение документации"
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему игрока решаем?
      description: Опишите ситуацию и целевого пользователя
      placeholder: Игрок хочет…, но сейчас…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как должен измениться пользовательский опыт?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Направление
      options:
        - Профили и приватность
        - Публикации и обсуждения
        - Подписки и поиск
        - Клубы и сообщества
        - Мобильный интерфейс
        - Безопасность и модерация
        - Другое
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Как поймём, что улучшение готово?
      description: Наблюдаемый результат или сценарий
  - type: checkboxes
    id: scope_check
    attributes:
      label: Контекст
      options:
        - label: Проверил(а) дорожную карту и существующие спецификации
          required: true
