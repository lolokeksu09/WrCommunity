name: LocalDream UI audit (isolated)
on:
  push:
    branches: [test/localdream-ui-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact LocalDream revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: lolokeksu09/LocalDream-Enhanced
          ref: cf3f4692bc40eaa2e8251d2b422b050c8c4f4ba3
          persist-credentials: false
      - name: Configure Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare emulator and SDK
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"; then
              break
            fi
            echo "SDK download failed, attempt $attempt of 3"
            sleep 5
          done
          test -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
      - name: Build exact revision with its pinned upstream runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/xororz/local-dream/releases/download/v3.0.0-alpha.6/LocalDream_armv8a_3.0.0-alpha.6.apk" --output "$RUNNER_TEMP/upstream.apk"
          echo "bec75b588200eb83aedd82b0a26ed8c5de4cfd923d0f51e1e65d241fccc11f82  $RUNNER_TEMP/upstream.apk" | sha256sum --check
          python3 - "$RUNNER_TEMP/upstream.apk" <<'PY'
          import sys, zipfile
          from pathlib import Path
          root = Path("app/src/main")
          with zipfile.ZipFile(sys.argv[1]) as z:
              for name in z.namelist():
                  if name.startswith("lib/arm64-v8a/") and name.endswith(".so"):
                      target = root / "jniLibs" / name.removeprefix("lib/")
                  elif name.startswith(("assets/qnnlibs/", "assets/ditlibs/", "assets/licenses/qnn-2.51.0.260929/")) and not name.endswith("/"):
                      target = root / name
                  else:
                      continue
                  if root.resolve() not in target.resolve().parents:
                      raise ValueError(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          PY
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/audit.jks" -storetype JKS -storepass audit-password -keypass audit-password -alias audit -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Local UI Audit"
          ./gradlew --no-daemon -PPREVIEW_BUILD=true -PRELEASE_STORE_FILE="$RUNNER_TEMP/audit.jks" -PRELEASE_STORE_PASSWORD=audit-password -PRELEASE_KEY_ALIAS=audit -PRELEASE_KEY_PASSWORD=audit-password :app:assembleBasicDebug
      - name: Launch and capture app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n audit_phone -k "system-images;android-35;google_apis;x86_64" -d pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee audit-output/avds.txt
          "$ANDROID_HOME/emulator/emulator" -avd audit_phone -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > audit-output/emulator.log 2>&1 &
          timeout 120s adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell getprop ro.product.cpu.abilist | tee audit-output/abis.txt
          APK_PATH="$(find app/build/outputs/apk/basic/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          adb install "$APK_PATH"
          adb shell pm grant io.github.xororz.localdream.preview android.permission.POST_NOTIFICATIONS || true
          adb shell am start -n io.github.xororz.localdream.preview/io.github.xororz.localdream.MainActivity
          sleep 20
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml audit-output/initial.xml
          adb exec-out screencap -p > audit-output/01-home.png
          adb shell am force-stop io.github.xororz.localdream.preview
          adb shell run-as io.github.xororz.localdream.preview mkdir -p files/models/UIAuditModel
          adb shell run-as io.github.xororz.localdream.preview touch files/models/UIAuditModel/finished
          adb shell run-as io.github.xororz.localdream.preview touch files/models/UIAuditModel/SDXL
          adb shell run-as io.github.xororz.localdream.preview touch files/models/UIAuditModel/unet.mnn
          printf '%s' '{"default_cfg":1,"default_steps":8}' > audit-output/fixture-config.json
          adb push audit-output/fixture-config.json /data/local/tmp/localdream-audit-config.json
          adb shell run-as io.github.xororz.localdream.preview cp /data/local/tmp/localdream-audit-config.json files/models/UIAuditModel/config.json
          adb shell am start -n io.github.xororz.localdream.preview/io.github.xororz.localdream.MainActivity
          sleep 20
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml audit-output/model-list.xml
          adb exec-out screencap -p > audit-output/02-model-list.png
          python3 - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          root = ET.parse("audit-output/model-list.xml").getroot()
          if any("Pixel Launcher isn't responding" in n.attrib.get("text", "") for n in root.iter("node")):
              close = next(n for n in root.iter("node") if n.attrib.get("text") == "Close app")
              x1,y1,x2,y2 = map(int, re.findall(r"\d+", close.attrib["bounds"]))
              subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
              import time
              time.sleep(5)
              subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], check=True)
              subprocess.run(["adb", "pull", "/sdcard/window.xml", "audit-output/model-list.xml"], check=True)
              root = ET.parse("audit-output/model-list.xml").getroot()
          def click_text(root, text):
              for node in root.iter("node"):
                  if node.attrib.get("text") == text:
                      x1,y1,x2,y2 = map(int, re.findall(r"\d+", node.attrib["bounds"]))
                      subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
                      import time
                      time.sleep(3)
                      return
              raise SystemExit("Control missing: " + text)
          def capture(name):
              subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/catalog.xml"], check=True)
              subprocess.run(["adb", "pull", "/sdcard/catalog.xml", "audit-output/" + name + ".xml"], check=True)
              with open("audit-output/" + name + ".png", "wb") as out:
                  subprocess.run(["adb", "exec-out", "screencap", "-p"], check=True, stdout=out)
              return ET.parse("audit-output/" + name + ".xml").getroot()
          click_text(root, "NPU Models")
          root = capture("02a-npu")
          click_text(root, "CPU Models")
          root = capture("02b-cpu")
          if not any(n.attrib.get("text") == "1024×1024" for n in root.iter("node")): raise AssertionError("SDXL canvas size missing")
          search = next(n for n in root.iter("node") if n.attrib.get("class") == "android.widget.EditText")
          x1,y1,x2,y2 = map(int, re.findall(r"\d+", search.attrib["bounds"]))
          subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
          subprocess.run(["adb", "shell", "input", "text", "zznomatchzz"], check=True)
          subprocess.run(["adb", "shell", "input", "keyevent", "4"], check=True)
          root = capture("02c-search-empty")
          clear = next(n for n in root.iter("node") if n.attrib.get("content-desc", "").lower() == "clear search")
          x1,y1,x2,y2 = map(int, re.findall(r"\d+", clear.attrib["bounds"]))
          subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
          root = capture("02c-search-cleared")
          click_text(root, "Pinned")
          root = capture("02c-pinned")
          texts = [n.attrib.get("text", "") for n in root.iter("node")]
          if "No pinned models" not in texts or "Touch and hold an installed model, then tap the pin icon." not in texts: raise AssertionError("Pinned empty state or hint missing")
          click_text(root, "All")
          root = capture("02d-all")
          for node in root.iter("node"):
              if "UIAuditModel" not in node.attrib.get("text", ""):
                  continue
              bounds = re.findall(r"\d+", node.attrib.get("bounds", ""))
              if len(bounds) == 4:
                  x1,y1,x2,y2 = map(int, bounds)
                  subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
                  break
          else:
              raise SystemExit("Synthetic test model not visible; see model-list.xml and screenshot.")
          PY
          sleep 15
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml audit-output/prompt.xml
          adb exec-out screencap -p > audit-output/03-prompt.png
          adb shell settings put system font_scale 1.3
          sleep 8
          adb exec-out screencap -p > audit-output/04-large-font.png
          adb shell settings put system font_scale 1.0
          sleep 5
          python3 - <<'PY'
          import re, subprocess, time, xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path("audit-output")
          def adb(*args):
              return subprocess.run(["adb", *args], check=True, stdout=subprocess.PIPE).stdout
          def snapshot(name):
              adb("shell", "uiautomator", "dump", "/sdcard/audit.xml")
              adb("pull", "/sdcard/audit.xml", str(out / (name + ".xml")))
              (out / (name + ".png")).write_bytes(adb("exec-out", "screencap", "-p"))
              return ET.parse(out / (name + ".xml")).getroot()
          def tap_node(root, *, text=None, clazz=None):
              for node in root.iter("node"):
                  if text is not None and node.attrib.get("text") != text: continue
                  if clazz is not None and node.attrib.get("class") != clazz: continue
                  b = list(map(int, re.findall(r"\d+", node.attrib.get("bounds", ""))))
                  if len(b) == 4:
                      adb("shell", "input", "tap", str((b[0]+b[2])//2), str((b[1]+b[3])//2))
                      time.sleep(3)
                      return
              raise RuntimeError("control not visible: " + str(text or clazz))
          def field(root):
              return next(n.attrib.get("text", "") for n in root.iter("node") if n.attrib.get("class") == "android.widget.EditText")
          root = snapshot("05-before")
          original = field(root)
          tap_node(root, text="Anime")
          dialog = snapshot("06-confirm-style")
          tap_node(dialog, text="Cancel")
          cancelled = snapshot("07-cancelled")
          if field(cancelled) != original: raise AssertionError("Cancel changed the prompt")
          tap_node(cancelled, text="Anime")
          dialog = snapshot("08-confirm-again")
          tap_node(dialog, text="Replace")
          first = snapshot("09-anime-first")
          tap_node(first, text="Anime")
          second = snapshot("10-anime-second")
          if field(first) == field(second): raise AssertionError("Anime did not change on repeat tap")
          tap_node(second, text="Auto")
          menu = snapshot("11-format-menu")
          tap_node(menu, text="Tags")
          tags = snapshot("12-tags-selected")
          tap_node(tags, text="Anime")
          tagged = snapshot("13-anime-tags")
          tap_node(tagged, clazz="android.widget.EditText")
          snapshot("14-keyboard")
          adb("shell", "input", "keyevent", "4")
          time.sleep(2)
          adb("shell", "input", "swipe", "510", "1600", "510", "700", "500")
          time.sleep(2)
          snapshot("15-lower-prompt")
          adb("shell", "input", "swipe", "510", "500", "510", "1500", "500")
          time.sleep(2)
          root = snapshot("16-after-scroll")
          tap_node(root, text="Result")
          result = snapshot("17-result")
          tap_node(result, text="Import image for UltraFix")
          imported = snapshot("17a-import-dialog")
          tap_node(imported, text="Cancel")
          result = snapshot("17b-after-import-cancel")
          tap_node(result, text="History")
          history = snapshot("18-history")
          adb("shell", "cmd", "uimode", "night", "yes")
          time.sleep(8)
          dark = snapshot("19-history-dark")
          tap_node(dark, text="Prompt")
          snapshot("20-prompt-dark")
          print("Completed style cycling, tags, keyboard, scrolling, tabs and dark theme checks.")
          PY
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: localdream-ui-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7
