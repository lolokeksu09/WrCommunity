name: One-shot Premium 2.0 identical-feed A/B
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: premium-paired-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  identical-feed-ab:
    if: github.head_ref == 'perf/premium-2-identical-feed-ab-2026-10-27'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare both production Vite builds with identical synthetic feed
        run: node scripts/ci/premium-preload-paired.mjs
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: premium-preload-identical-feed-ab
          path: test-results/premium-preload-paired/result.json
          if-no-files-found: ignore
          retention-days: 7
