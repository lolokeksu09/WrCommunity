name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/android-3d-editor-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Project Workflow Standard
        run: python3 standards/project-workflow-v1.4-rc3/tools/check_standard.py standards/project-workflow-v1.4-rc3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build and unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Build release if signing secrets are configured
        env:
          EDITOR_KEYSTORE_B64: ${{ secrets.EDITOR_KEYSTORE_B64 }}
          EDITOR_STORE_PASSWORD: ${{ secrets.EDITOR_STORE_PASSWORD }}
          EDITOR_KEY_PASSWORD: ${{ secrets.EDITOR_KEY_PASSWORD }}
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ -z "$EDITOR_KEYSTORE_B64" || -z "$EDITOR_STORE_PASSWORD" || -z "$EDITOR_KEY_PASSWORD" ]]; then
            echo "Signing secrets not installed: release build skipped."
            exit 0
          fi
          printf '%s' "$EDITOR_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/editor-upload.jks"
          chmod 600 "$RUNNER_TEMP/editor-upload.jks"
          export ANDROID_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/editor-upload.jks"
          export ANDROID_SIGNING_STORE_PASSWORD="$EDITOR_STORE_PASSWORD"
          export ANDROID_SIGNING_KEY_PASSWORD="$EDITOR_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease
      - name: Upload signed release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-3d-editor-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
      - name: Archive Android SDK apksigner for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: android-3d-editor-apksigner
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-3d-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
