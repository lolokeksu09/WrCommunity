# Temporary audit-only isolated runner. Remove after uploading baseline evidence.
# Runs on a disposable GitHub runner: never connects to production or VDS.
name: Premium 2.0 feed design isolated visual and mobile acceptance
on:
  push:
    branches: [feat/premium-2-feed-design-2026-10-27]
permissions:
  contents: read
jobs:
  isolated-browser-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: wrcommunity
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: wrcommunity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wrcommunity -d wrcommunity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports: ['1025:1025', '8025:8025']
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: '13000'
      APP_ORIGIN: http://127.0.0.1:13000
      DATABASE_URL: postgresql://wrcommunity:integration-only-password@127.0.0.1:5432/wrcommunity_test
      COOKIE_SECRET: ci-only-cookie-secret-at-least-thirty-two-characters
      LFG_CONTACT_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_REQUIRE_TLS: 'false'
      SMTP_FROM: 'WrCommunity CI <no-reply@example.invalid>'
      MEDIA_STORAGE_DIR: /tmp/wrc-premium-media
      MEDIA_DIR: /tmp/wrc-premium-media
      WEB_ROOT: dist/web
      WRC_BASELINE_URL: http://127.0.0.1:13000/
      E2E_BASE_URL: http://127.0.0.1:13000
      WRC_E2E_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Build actual application
        run: |
          npm ci
          npm run build
          npm run migrate
      - name: Diagnostic unit regressions
        run: node --test tests/premium-cls-diagnostics.test.mjs tests/premium-baseline-guard.test.mjs
      - name: Install local Chromium
        run: npx playwright install chromium
      - name: Start local API and verify readiness
        run: |
          node dist/server/index.js > /tmp/wrc-premium-server.log 2>&1 &
          curl --fail --silent --show-error --retry 40 --retry-connrefused --retry-delay 1 http://127.0.0.1:13000/health/ready
      - name: Targeted mobile feed E2E on isolated data
        run: npx playwright test --config scripts/playwright.config.ts --project=mobile-chromium tests/e2e/home-feed-ux.spec.ts
      - name: Capture 20 local read-only screen states
        run: |
          node scripts/ci/premium-visual-baseline.mjs
          printf '%s\n' "$GITHUB_SHA" > test-results/premium-baseline/source-sha.txt
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: premium-2-isolated-baseline
          path: |
            test-results/premium-baseline/
            test-results/**/*premium2*png
          if-no-files-found: warn
          retention-days: 7
