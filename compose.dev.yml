name: wrcommunity-dev
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: wrcommunity
      POSTGRES_DB: wrcommunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wrcommunity -d wrcommunity']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: [mail]
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  postgres_dev: {}
