/* V5 visual review: restrained materials, editorial hierarchy, intentionally selective imagery */
:root{--bg:#090d14;--panel:#141b28;--panel2:#1d293c;--edge:#2a364a;--text:#f4f5fa;--muted:#b8c1d0;--quiet:#94a0b2;--accent:#b1c8ff;--blue:#8badf6;--violet:#9685c3;--serif:Georgia,'Times New Roman',serif}
body{background:radial-gradient(ellipse at 52% 0%,#1b2032 0%,#080a0e 65%);font-size:15.5px;line-height:1.55;letter-spacing:-.006em}
.shell{max-width:460px;border-color:#263144;background:linear-gradient(180deg,#0c111b 0%,#090d14 37%,#090d14 100%)}
.shell:has(.bottom){padding-bottom:94px}

.demo-control{border:1px solid #303e53;background:#171f2d;border-radius:8px;padding:2px}
.demo-control button{color:#c0c9d8;border-radius:6px;min-height:28px}
.demo-control button.sel{background:#d6def0;color:#16223b;font-weight:720}
.header{height:69px;padding:0 18px 0 19px;gap:10px;border-bottom:1px solid rgba(169,193,242,.11);background:rgba(9,13,21,.96);backdrop-filter:blur(18px)}
.monogram{width:35px;height:35px;background:linear-gradient(145deg,#1b3153,#182037);border:1px solid #7183a9;border-radius:10px;box-shadow:inset 0 1px rgba(230,236,255,.13)}
.monogram svg{width:23px;height:23px}
.brand{font-size:19px;letter-spacing:-.047em;font-weight:740;color:#f7f7fc}
.iconbtn{color:#bbc9de;min-width:43px;min-height:44px}
.iconbtn:hover{background:#161f30}
.body{padding:0 19px 48px}
.view-head{margin:23px 0 14px;align-items:baseline}
.view-head h1{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.sup{font-size:11px;color:#9baac1}
.hero-shell{padding:0 5px 9px 0;margin:0 0 7px}
.hero-shell:before{top:11px;right:15px;left:5px;bottom:1px;border-color:#3c3a62;background:#1e233f;border-radius:17px;transform:rotate(-.8deg)}
.hero-shell:after{top:9px;right:0;left:14px;bottom:0;background:linear-gradient(125deg,#1b2440,#29203f);border-color:#4c4165;border-radius:17px;transform:rotate(.85deg)}
.hero{height:197px;background:#131d30;border-radius:17px;border:1px solid #505e7c;box-shadow:0 12px 32px rgba(0,0,0,.17),inset 0 1px rgba(255,255,255,.1)}
.hero-slide{background-position:64% 36%;background-size:cover}
.hero-slide:after{background:linear-gradient(90deg,rgba(8,14,26,.94) 0%,rgba(8,14,26,.79) 42%,rgba(8,14,26,.08) 89%),linear-gradient(0deg,rgba(10,15,25,.42),transparent 45%)}
.hero-content{padding:18px 19px 17px}
.hero-eyebrow{color:#c6d8f9;font-size:11px;font-weight:520;letter-spacing:.045em;margin:0 0 10px}
.hero h2{max-width:230px;font:600 29px/1.065 var(--serif);letter-spacing:-.035em;color:#fff;text-wrap:balance;text-shadow:0 1px 6px #0b1122}
.hero p{font-size:13px;line-height:1.45;max-width:222px;color:#e0e7f2;margin:8px 0 0}
.hero-action{background:#d9e6ff;border:1px solid #edf2ff;color:#132342;font-size:12px;min-height:39px;padding:0 14px;border-radius:9px;font-weight:680;box-shadow:0 4px 12px #080d18b3}
.hero-next{background:rgba(10,16,30,.77);border-color:rgba(221,231,255,.34);width:43px;height:43px;right:10px;bottom:12px}
.hero-controls{margin:1px 0 0;font-size:11px;color:#a1afc6;min-height:35px}
.hero-dots button:after{background:#4b5a75;height:3px}
.hero-dots button.sel:after{background:#c9dbff}
.secrow{margin-top:23px;margin-bottom:7px;gap:10px}
.secrow h2{font:600 23px/1.15 var(--serif);letter-spacing:-.02em;color:#f3f4f8}
.secrow>button{color:#a7bfe8;font-size:12.5px;display:flex;gap:4px;align-items:center;min-height:44px}

.post-actions{margin-top:10px;gap:10px}

.react.active{color:#efa5bf}.react.saved{color:#a6c7ff}
.people-scroll{gap:11px;padding:5px 0 10px}
.person{min-width:152px;width:152px;border:1px solid #2e3a4c;background:linear-gradient(150deg,#192130,#121925);border-radius:12px;padding:14px;box-shadow:inset 0 1px rgba(255,255,255,.035)}
.person .avatar{width:45px;height:45px;margin-bottom:10px}
.person-name{font-size:14px;font-weight:670}
.person small{font-size:12px;margin-top:3px;color:#b0bfd2}
.person .text-button{margin-top:12px;width:100%}
.text-button{border-color:#60738e;color:#e6edf9;background:#172131;min-height:43px;border-radius:8px;font-size:12px;font-weight:590}
.text-button.on{border-color:#7f9aca;background:#293953}
.compact-line{gap:12px;padding:15px 0;border-top:1px solid #293548}
.club-symbol{width:52px;height:52px;border:1px solid #52617f;border-radius:11px;background-color:#1c2540;background-size:cover;background-position:center}

.bottom{border-top:1px solid rgba(180,199,233,.18);background:rgba(13,18,29,.96);padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -15px 35px #080c18bb;backdrop-filter:blur(18px)}
.nav-btn{min-height:56px;font-size:10.5px;gap:3px;color:#a8b6c9}
.nav-btn svg{width:22px;height:22px}
.nav-btn[aria-current=page]{color:#c6d7fd}
.nav-btn.create svg{background:#bbcefa;color:#152741;border-radius:12px;width:40px;height:40px;box-shadow:0 5px 15px #141d329c}
.subhead{font:600 28px/1.18 var(--serif);margin:24px 0 11px}
.subnote{font-size:14px;color:#acbbd0}
.search-box{background:#151f2e;border-color:#3f4d63}
.empty{background:#141d2b;border-color:#303e53;border-radius:11px}
.primary{background:#c2d3f5;color:#13213b;font-weight:700}
.secondary{border-color:#667894}

.cover{height:128px;background:linear-gradient(0deg,#111a2cc4,#111a2c13),linear-gradient(120deg,#202f4e,#453b5e);border-color:#526689;border-radius:15px}
.profile-dot{background:#31456b;color:#f4f7ff}

/* WrCommunity v6 — intentional social/editorial hierarchy, borrowed UX patterns not a skin of other products. */
:root{--bg:#0a0c11;--panel:#131720;--panel2:#1a2230;--edge:#2b3444;--text:#f1f3f8;--muted:#aeb7c7;--quiet:#919dad;--accent:#d2ddf3;--blue:#99b5e9;--violet:#8e82b5;--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
html{scrollbar-gutter:auto}body{background:#080a0f;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.012em}
.shell{max-width:464px;background:#0d1017;border-color:#252b37}
.demo-bar{height:43px;background:#161b24;border-color:#333a47;padding:0 16px;gap:10px}
.demo-label{font-size:11px;white-space:nowrap;color:#bac4d2;letter-spacing:.02em}
.seed-mode{margin-left:auto;background:transparent;color:#aab9d0;border:1px solid #40495a;border-radius:6px;padding:6px 9px;font-size:11px;white-space:nowrap;min-height:32px}
.seed-mode[aria-pressed=true]{background:#303b4d;color:#fff;border-color:#758aaa}
.demo-control{border:0;background:#252b37;border-radius:7px;padding:2px;gap:1px;flex-shrink:0}
.demo-control button{padding:5px 9px;min-height:29px;font-size:11px;line-height:1.25;color:#c3ccdb}
.demo-control button.sel{background:#cdd9ec;color:#172235;border-radius:5px}
.header{height:64px;padding:0 19px;background:rgba(13,16,23,.97);border-color:#252c38;gap:9px;backdrop-filter:blur(14px)}
.monogram{width:31px;height:31px;border-color:#647795;background:#182435;border-radius:8px;box-shadow:none}
.monogram svg{width:20px;height:20px}
.brand{font-size:19px;font-weight:740;letter-spacing:-.045em;color:#f2f4fa}
.iconbtn{min-width:44px;min-height:44px;border-radius:9px;color:#cbd2dd}
.iconbtn:active,.nav-btn:active{background:#263045}
.body{padding:0 20px 42px}
.hero-shell{padding:0 6px 6px 1px;margin:20px 0 4px}
.hero-shell:before,.hero-shell:after{border-radius:13px;box-shadow:none}
.hero-shell:before{top:7px;left:4px;right:13px;bottom:1px;background:#232035;border-color:#42405e;transform:rotate(-.55deg)}
.hero-shell:after{top:6px;left:13px;right:0;bottom:0;background:#1f2e42;border-color:#3c4e68;transform:rotate(.45deg)}
.hero{height:165px;border-radius:13px;border:1px solid #4d5770;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.hero-slide:after{background:linear-gradient(90deg,rgba(8,12,21,.92) 0%,rgba(8,12,21,.78) 35%,rgba(8,12,21,.18) 88%)}
.hero-content{padding:16px 17px}
.hero-eyebrow{font-size:11px;font-weight:580;color:#cbd8ec;letter-spacing:.012em;margin-bottom:7px}
.hero h2{font:680 26px/1.07 var(--sans);letter-spacing:-.052em;max-width:190px}
.hero p{font-size:12.5px;color:#e0e5ec;max-width:210px;line-height:1.4;margin-top:6px}
.hero-action{background:#e2e8f4;color:#142138;border:0;box-shadow:none;border-radius:7px;font-size:12px;font-weight:670;min-height:37px;padding:0 12px}
.hero-next{height:43px;width:43px;right:9px;bottom:11px;border-color:#68738a;background:rgba(17,24,37,.76)}
.hero-controls{margin:2px 0 0;min-height:26px;font-size:11.5px;color:#9eacbf}
.hero-dots button{min-width:34px;padding:10px 2px}
.hero-dots button:after{background:#465166}
.hero-dots button.sel:after{background:#d0d9ec}
.shell.is-member .hero{height:127px}
.shell.is-member .hero-content{padding:13px 17px}
.shell.is-member .hero-eyebrow{margin-bottom:4px}
.shell.is-member .hero h2{font-size:23px}
.shell.is-member .hero p{margin-top:3px}
.shell.is-member .hero-action{min-height:33px}
.feed-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:20px 0 1px}
.feed-headline{display:flex;align-items:baseline;gap:11px;min-width:0}
.feed-head h2{margin:0;font-size:22px;letter-spacing:-.04em;line-height:1.16;font-weight:730}
.feed-context{font-size:11px;color:#9aa7b9;white-space:nowrap}
.feed-explore{display:flex;align-items:center;justify-content:center;gap:5px;background:transparent;color:#cbd8ea;border:0;font-size:12px;min-height:44px;padding:0 3px;white-space:nowrap}
.feed-explore svg{height:17px;width:17px}
.tabs{gap:28px;border-bottom:1px solid #303746}
.tab{font-size:13px;font-weight:620;min-height:41px;color:#9faaBD;padding:0 1px}
.tab[aria-selected=true]{color:#e5eaf4;border-color:#c4d2ea}
.post{border-bottom:1px solid #2b323e;padding:21px 0 25px}
.post-top{gap:10px;align-items:center}
.post .avatar{width:40px;height:40px;border:1px solid #57647d;box-shadow:none}
.author{font-size:14px;font-weight:700;color:#e9edf5;letter-spacing:-.01em}
.byline{font-size:11.5px;color:#a2afc1;margin-top:1px}
.post .iconbtn{margin-left:auto}
.post-topic{display:inline-flex;color:#b7c7e0;font-size:11.5px;font-weight:580;margin-top:15px;letter-spacing:.012em}
.post h3{font:680 19px/1.32 var(--sans);letter-spacing:-.035em;margin:6px 0 7px;color:#f0f2f7;text-wrap:pretty}
.copy{font-size:14px;color:#c3cbd7;line-height:1.57;margin:0;letter-spacing:0}
.art{border:0;border-radius:11px;aspect-ratio:1.94/1;margin-top:15px;box-shadow:0 4px 15px rgba(0,0,0,.16);background-position:center 39%}
.art-label{border:1px solid #596477;color:#c7d2e4;background:rgba(10,14,25,.82);font-size:10px;border-radius:5px;letter-spacing:0;padding:3px 7px}
.post-actions{margin-top:9px;gap:14px}
.react{min-height:45px;min-width:44px;color:#a2b0c4;font-size:12px;gap:6px}
.react svg{height:20px;width:20px}
.react.active{color:#e6a5b3}
.react.saved{color:#afc6ec}
.people-heading,.club-heading{margin-top:26px;margin-bottom:0}
.secrow h2{font:710 21px/1.22 var(--sans);letter-spacing:-.034em;color:#f1f3f7}
.secrow>button{font-size:12px;color:#bacbe4;font-weight:560;min-height:44px}
.section-intro{color:#a2b0c3;font-size:13px;margin:0 0 8px}
.people-scroll{display:flex;flex-direction:column;gap:0;overflow:visible;padding:0;margin-top:7px}
.person{width:100%;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 0;background:none;border:0;border-bottom:1px solid #293241;box-shadow:none;border-radius:0}
.person .avatar{width:48px;height:48px;margin:0;flex:none}
.person-copy{min-width:0;flex:1;display:flex;flex-direction:column}
.person-name{font-size:14px;font-weight:690}
.person small{font-size:12px;margin:2px 0 0;color:#9fadbe}
.person .text-button{margin:0;width:auto;padding:0 13px;flex:none;min-height:40px}
.text-button{background:#1d2837;border:1px solid #576a84;color:#dfe7f4;border-radius:8px;font-size:12px;min-height:40px}
.text-button.on{background:#293a50;border-color:#7a96b6}
.compact-line{border-top:0;border-bottom:1px solid #293241;padding:14px 0;gap:12px}
.club-symbol{width:55px;height:55px;border-radius:11px;border:1px solid #4e6281}
.club-info b{font-size:14px}.club-info span{font-size:12px;color:#a4b0c1}
.notice{color:#8592a6;font-size:11px;text-align:center;margin:24px 6px 2px;line-height:1.55}
.bottom{background:rgba(16,20,29,.98);border-color:#303846;box-shadow:none;padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(20px)}
.nav-btn{min-height:53px;color:#a7b3c3;font-size:10px;gap:3px}
.nav-btn[aria-current=page]{color:#d1def3}
.nav-btn svg{height:20px;width:20px}
.nav-btn.create svg{background:#dae4f3;color:#172338;width:37px;height:37px;border-radius:10px;box-shadow:none}
.subhead{font:720 26px/1.18 var(--sans);letter-spacing:-.04em}
.subnote{font-size:14px;color:#a3b1c5}
.search-box,.field{background:#171e2b;border-color:#47556a}
.primary{background:#d8e4f3;color:#172235;font-weight:660}
.secondary{border:1px solid #6b7c95;color:#e1e8f2}
.cover{border-radius:11px}
.empty{border:1px solid #323e50;background:#141a25;padding:22px;border-radius:12px;margin:22px 0}
.empty h3{margin-top:6px;font-size:19px;letter-spacing:-.03em}
.empty p{font-size:14px;line-height:1.55;color:#aeb9c9}
.empty-mark{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid #5d6f86;border-radius:10px;font-size:28px;color:#c6d5e8;margin-bottom:6px}
.launch-note{padding:20px 2px;margin:7px 0 14px;border-top:1px solid #323c4d}
.launch-note h2{margin:0 0 8px;font-size:21px;line-height:1.25}
.launch-note p{font-size:14px;line-height:1.6;color:#a8b6c6}
.launch-note button{min-height:44px;background:transparent;border-color:#57687e}
@media(max-width:350px){.body{padding:0 15px 38px}.header{padding:0 12px}.brand{font-size:17px}.demo-bar{padding:0 8px;gap:6px}.demo-control button{padding:5px 7px}.seed-mode{padding:5px 6px;font-size:10px}.hero h2{font-size:24px}.feed-context{display:none}}
@media(prefers-reduced-motion:reduce){.hero-track{transition:none!important}}

function toggleEmpty(){state.empty=!state.empty;const b=document.getElementById('seedMode');b.setAttribute('aria-pressed',String(state.empty));b.textContent=state.empty?'Примеры':'Пустая сеть';state.page='home';state.tab='all';render();window.scrollTo(0,0)}
function setMode(v){state.member=!!v;document.querySelector('.shell').classList.toggle('is-member',!!v);document.getElementById('guestMode').classList.toggle('sel',!v);document.getElementById('memberMode').classList.toggle('sel',v);state.page='home';state.tab='all';render();window.scrollTo(0,0)}
function nav(page){if(page==='create'){if(!auth())return;modal('create');return}if(page==='profile'&&!state.member){modal('login');return}state.page=page;render();window.scrollTo(0,0)}
function renderNav(){document.getElementById('bottom').innerHTML=[['home','Главная'],['search','Поиск'],['create','Создать'],['clubs','Клубы'],['profile','Профиль']].map(([id,label])=>`<button class="nav-btn ${id==='create'?'create':''}" onclick="nav('${id}')" ${state.page===id?'aria-current="page"':''} aria-label="${label}">${icon(({home:'home',search:'search',create:'plus',clubs:'users',profile:'user'})[id])}<span>${label}</span></button>`).join('')}
const slides=[{title:'Найти своих',caption:'Авторы, команды и темы, которые тебе близки.',label:'Открытия',button:'Смотреть игроков',target:'search',img:'hero1'},{title:'Клубы по интересам',caption:'Своя компания за пределами матча.',label:'Сообщества',button:'Открыть клубы',target:'clubs',img:'hero2'},{title:'Есть что обсудить?',caption:'Тактика, впечатления и собственные истории.',label:'Обсуждения',button:'Создать запись',target:'create',img:'hero3'}];
function hero(){return `<div class="hero-shell"><div class="hero"><div class="hero-track" id="heroTrack" tabindex="0" aria-label="Карточки открытий, стрелки для переключения">${slides.map((x,i)=>`<section class="hero-slide" style="background-image:url('${ART[x.img]}')"><div class="hero-content"><span class="hero-eyebrow">${esc(x.label)} · ${i+1}/3</span><h2>${esc(state.member&&i===0?'Вокруг Рифта':x.title)}</h2><p>${esc(state.member&&i===0?'Новые лица, клубы и темы.':x.caption)}</p><button class="hero-action" onclick="nav('${x.target}')">${esc(x.button)} ${icon('arrow')}</button></div></section>`).join('')}</div><button class="hero-next" aria-label="Следующая карточка" onclick="slideTo(state.slide+1)">${icon('arrow')}</button></div></div><div class="hero-controls"><span>Открой для себя</span><div class="hero-dots">${slides.map((_,i)=>`<button aria-label="Карточка ${i+1}" aria-current="${state.slide===i}" class="${state.slide===i?'sel':''}" onclick="slideTo(${i})"></button>`).join('')}</div></div>`}
function slideTo(i){state.slide=(i+slides.length)%slides.length;const t=document.getElementById('heroTrack');if(!t)return;t.style.transform=`translateX(-${state.slide*100}%)`;document.querySelectorAll('.hero-dots button').forEach((e,j)=>{e.classList.toggle('sel',j===state.slide);e.setAttribute('aria-current',String(j===state.slide))})}
function swipe(){const t=document.getElementById('heroTrack');if(!t)return;let x,y;t.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});t.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)slideTo(state.slide+(dx<0?1:-1))},{passive:true});t.addEventListener('keydown',e=>{if(e.key==='ArrowRight')slideTo(state.slide+1);if(e.key==='ArrowLeft')slideTo(state.slide-1)})}
function allPosts(){return [...state.mine,...posts]}
function avatar(p){const photo=AVATARS[p.id];return `<div class="avatar ${p.avatar||''} ${photo?'photo':''}" ${photo?`style="background-image:url('${photo}')"`:''} role="img" aria-label="Аватар: ${esc(p.name)}">${photo?'':esc(p.initial)}</div>`}
function postUI(p){const own=p.uid==='self',person=own?{name:'Мой профиль',handle:'@demo.member',initial:'Я',avatar:'mine'}:users.find(u=>u.id===p.uid);const followed=state.following.has(person?.id);const liked=state.liked.has(p.id),saved=state.saved.has(p.id);return `<article class="post" data-post="${esc(p.id)}"><div class="post-top">${avatar(person)}<div class="identity"><button class="author" onclick="${own?"nav('profile')":`openPerson('${person.id}')`}">${esc(person.name)}</button><span class="byline">${esc(person.handle)} · ${own?'только что':'демо-публикация'}</span></div><button class="iconbtn" aria-label="Действия с публикацией" onclick="toast('Дополнительные действия в прототипе не реализованы')">${icon('more')}</button></div><div class="post-topic">${esc(p.category||'Публикация')}</div><h3>${esc(p.title)}</h3><p class="copy">${esc(p.text)}</p>${p.art?`<div class="art" role="img" aria-label="Демонстрационная атмосферная иллюстрация" style="background-image:url('${ART[p.art]}')"><span class="art-label">Демо-иллюстрация</span></div>`:''}<div class="post-actions"><button class="react ${liked?'active':''}" aria-label="${liked?'Убрать реакцию':'Нравится'}" aria-pressed="${liked}" onclick="like('${p.id}')">${icon('heart')} ${liked?'Нравится':'Нравится'}</button><button class="react" aria-label="Комментарии" onclick="modal('comments','${p.id}')">${icon('message')} ${state.comments.filter(x=>x.post===p.id).length||'Ответить'}</button><button class="react push ${saved?'saved':''}" aria-label="${saved?'Убрать закладку':'Сохранить'}" aria-pressed="${saved}" onclick="savePost('${p.id}')">${icon('bookmark')}</button></div></article>`}
function filterPosts(){return (state.empty?[]:allPosts()).filter(p=>{if(p.uid==='self')return !state.private||state.member;return true}).filter(p=>state.tab==='all'||(p.uid==='self'||state.following.has(p.uid)))}
function home(){const listed=filterPosts();return `<h1 class="sr">Главная WrCommunity</h1>${hero()}<div class="feed-head"><div class="feed-headline"><h2>Лента</h2><span class="feed-context">Публикации сообщества</span></div><button class="feed-explore" onclick="nav('search')" aria-label="Искать участников">${icon('search')}<span>Найти</span></button></div><div class="tabs" role="tablist" aria-label="Тип ленты"><button class="tab" role="tab" aria-selected="${state.tab==='all'}" onclick="changeTab('all')">Все</button><button class="tab" role="tab" aria-selected="${state.tab==='following'}" onclick="changeTab('following')">Подписки</button></div><div id="posts">${state.tab==='following'&&!state.member?`<div class="empty"><h3>Лента подписок</h3><p>Войди, чтобы читать публикации авторов, на которых подписался.</p><button class="primary" onclick="modal('login')">Войти</button></div>`:listed.length?listed.map(postUI).join(''):`<div class="empty empty-launch"><span class="empty-mark" aria-hidden="true">◇</span><h3>${state.empty?'Публикаций пока нет':'Здесь появятся публикации'}</h3><p>${state.empty?'Когда участники опубликуют первые записи, они появятся здесь. Пока можно изучить разделы сообщества.':'Подпишись на интересных авторов — их посты будут в ленте подписок.'}</p><button class="secondary" onclick="nav('search')">Перейти к поиску</button></div>`}</div>${state.empty?`<div class="launch-note"><h2>Сообщество начинается с людей</h2><p>Профили и клубы появятся здесь по мере регистрации и публикаций. Мы не показываем выдуманную активность.</p><button class="secondary" onclick="nav('clubs')">Открыть клубы ${icon('arrow')}</button></div>`:`<div class="secrow people-heading"><h2>Игроки</h2><button onclick="nav('search')">Смотреть всех ${icon('arrow')}</button></div><p class="section-intro">Найди людей по ролям и интересам.</p><div class="people-scroll">${users.slice(0,3).map(personUI).join('')}</div><div class="secrow club-heading"><h2>Клубы</h2><button onclick="nav('clubs')">Все клубы ${icon('arrow')}</button></div><p class="section-intro">Общие темы, знакомые лица и новые встречи.</p>${clubs.slice(0,2).map(clubUI).join('')}`}<div class="notice">Демонстрационный прототип: имена, посты, изображения и клубы вымышлены. Рабочего сервера нет.</div>`}
function personUI(p){return `<div class="person">${avatar(p)}<div class="person-copy"><b class="person-name">${esc(p.name)}</b><small>${esc(p.role)}</small></div><button class="text-button ${state.following.has(p.id)?'on':''}" onclick="follow('${p.id}')">${state.following.has(p.id)?'Отписаться':'Подписаться'}</button></div>`}
function clubUI(c){return `<div class="compact-line"><div class="club-symbol ${c.id==='together'?'f2':''}" style="background-image:url('${ART[c.id==='together'?'club2':'club1']}')" aria-label="Обложка клуба ${esc(c.title)}"></div><div class="club-info"><b>${esc(c.title)}</b><span>${esc(c.desc)}</span></div><button class="text-button ${state.joined.has(c.id)?'on':''}" onclick="join('${c.id}')">${state.joined.has(c.id)?'В клубе':'Вступить'}</button></div>`}
function changeTab(t){state.tab=t;render()}
function follow(id){if(!auth())return;state.following.has(id)?state.following.delete(id):state.following.add(id);render();toast(state.following.has(id)?'Подписка добавлена (демо)':'Подписка отменена')}
function join(id){if(!auth())return;state.joined.has(id)?state.joined.delete(id):state.joined.add(id);render();toast(state.joined.has(id)?'Вступление в клуб (демо)':'Вы вышли из клуба (демо)')}
function like(id){if(!auth())return;state.liked.has(id)?state.liked.delete(id):state.liked.add(id);render()}
function savePost(id){if(!auth())return;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);render();toast(state.saved.has(id)?'Запись сохранена':'Закладка удалена')}
function openPerson(id){const p=users.find(x=>x.id===id);if(!p)return;modal('person',id)}
function searchResults(){const q=state.search.trim().toLowerCase();return state.empty?'<div class="empty"><h3>Никого не найдено</h3><p>В новой сети профили и клубы появятся после первых регистраций.</p></div>':`<div class="secrow"><h2>Игроки</h2></div>${users.filter(p=>(p.name+' '+p.handle+' '+p.role).toLowerCase().includes(q)).map(p=>`<div class="compact-line">${avatar(p)}<div class="club-info"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div><button class="text-button" onclick="follow('${p.id}')">${state.following.has(p.id)?'Отписаться':'Подписаться'}</button></div>`).join('')||'<p class="subnote">Игроки не найдены.</p>'}<div class="secrow"><h2>Клубы</h2></div>${clubs.filter(c=>(c.title+' '+c.desc).toLowerCase().includes(q)).map(clubUI).join('')||'<p class="subnote">Клубы не найдены.</p>'}`}
function searchView(){return `<h1 class="subhead">Поиск</h1><p class="subnote">Публичные игроки и сообщества.</p><div class="search-box">${icon('search')}<input id="query" type="search" aria-label="Искать игроков и клубы" placeholder="Имя, роль или клуб…" oninput="state.search=this.value;document.getElementById('results').innerHTML=searchResults()" value="${esc(state.search)}"></div><div id="results">${searchResults()}</div>`}
function clubsView(){return `<h1 class="subhead">Клубы</h1><p class="subnote">Найди людей с похожими интересами.</p>${state.empty?'<div class="empty"><h3>Пока нет клубов</h3><p>Здесь появятся реальные клубы после запуска сообщества.</p></div>':clubs.map(clubUI).join('')}<div class="notice">Каталог демонстрационный. Создание клубов — отдельный будущий модуль.</div>`}
function profileView(){return `<h1 class="subhead">Мой профиль</h1><div class="cover"></div><div class="own-avatar">Я</div><div class="secrow"><h2>@demo.member</h2><span class="privacy-pill">${icon('lock')} ${state.private?'Скрытый':'Публичный'}</span></div><p class="subnote">Игровые роли и описание можно будет заполнить здесь.</p><div class="settings"><div><b>Приватность профиля</b><p>${state.private?'Собственные публикации скрыты от других.':'Профиль и опубликованные записи доступны гостям.'}</p></div><button class="secondary" onclick="togglePrivacy()">Изменить</button></div><div class="secrow"><h2>Мои публикации</h2><button onclick="nav('create')">Создать ${icon('plus')}</button></div>${state.mine.length?state.mine.map(postUI).join(''):`<div class="empty"><h3>Пока нет публикаций</h3><p>Создай первую запись. Данные прототипа исчезнут после обновления страницы.</p><button class="primary" onclick="nav('create')">Написать пост</button></div>`}`}
function togglePrivacy(){if(state.private)modal('openprivacy');else{state.private=true;render();toast('Профиль скрыт (демо)')}}
function render(){document.getElementById('topSearch').innerHTML=icon('search');document.getElementById('topBell').innerHTML=icon('bell');document.getElementById('topProfile').innerHTML=state.member?'<span class="profile-dot">Я</span>':icon('user');renderNav();const root=document.getElementById('main');root.innerHTML={home:home,search:searchView,clubs:clubsView,profile:profileView}[state.page]?.()??home();if(state.page==='home'){slideTo(state.slide);swipe()}}
function modal(kind,uid){let heading='',inside='';if(kind==='login'){heading='Войти в WrCommunity';inside=`<p>Публичную ленту можно читать без регистрации. Для подписок, комментариев и публикаций требуется вход.</p><div class="form-actions"><button class="secondary" onclick="closeModal()">Позже</button><button class="primary" onclick="closeModal();setMode(true);toast('Демо-режим участника')">Войти в демо</button></div>`}
if(kind==='create'){heading='Новая публикация';inside=`<div class="formrow"><label for="ttl">Заголовок</label><input class="field" id="ttl" maxlength="130" placeholder="О чём поговорим?"></div><div class="formrow"><label for="txt">Текст · до 5000 символов</label><textarea class="field multiline" id="txt" maxlength="5000" placeholder="Расскажи свою историю…" oninput="document.getElementById('count').textContent=this.value.length+' / 5000'"></textarea><span id="count" class="sup">0 / 5000</span></div><p>В прототипе доступен только текст; добавление до четырёх изображений предусмотрено спецификацией, но здесь не реализовано.</p><div class="form-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="publish()">Опубликовать</button></div>`}
if(kind==='comments'){heading='Комментарии';const post=allPosts().find(x=>x.id===uid);inside=`<p>${esc(post?.title||'Публикация')}</p><div class="comment-list">${state.comments.filter(x=>x.post===uid).map(c=>`<div class="comment"><strong>${esc(c.author)} ${c.hidden?'· скрытый профиль':''}</strong><p>${esc(c.body)}</p></div>`).join('')||'<p>Пока нет комментариев.</p>'}</div><div class="formrow"><label for="comment-text">Написать комментарий</label><textarea class="field" id="comment-text" maxlength="1000" placeholder="Ваш комментарий"></textarea></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Закрыть</button><button class="primary" onclick="comment('${uid}')">Отправить</button></div>`}
if(kind==='person'){const u=users.find(x=>x.id===uid);heading=u.name;inside=`<p>${esc(u.handle)} · ${esc(u.role)}. Публичный профиль демонстрационного участника.</p><div class="form-actions"><button class="secondary" onclick="closeModal()">Закрыть</button><button class="primary" onclick="closeModal();follow('${uid}')">${state.following.has(uid)?'Отписаться':'Подписаться'}</button></div>`}
if(kind==='openprivacy'){heading='Сделать профиль публичным?';inside=`<p>Твои опубликованные записи станут доступны всем, включая гостей. Черновики не публикуются. Комментарии под чужими публичными постами сохраняют твой ник и в скрытом режиме.</p><div class="form-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="state.private=false;closeModal();render();toast('Профиль открыт (демо)')">Открыть профиль</button></div>`}
document.getElementById('modalHost').innerHTML=`<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog-head"><h2 id="modalTitle">${heading}</h2><button class="iconbtn" aria-label="Закрыть" onclick="closeModal()">${icon('close')}</button></div><div class="dialog-body">${inside}</div></section></div>`;document.body.style.overflow='hidden';document.querySelector('.dialog input,.dialog textarea,.dialog .primary,.dialog .iconbtn')?.focus()}
function closeModal(){document.getElementById('modalHost').innerHTML='';document.body.style.overflow=''}
function publish(){const t=document.getElementById('ttl')?.value.trim(),b=document.getElementById('txt')?.value.trim();if(!t||!b){toast('Заполни заголовок и текст');return}state.id++;state.mine.unshift({id:'mine'+state.id,uid:'self',title:t,text:b,art:null});closeModal();state.page='profile';render();window.scrollTo(0,0);toast(state.private?'Пост создан — виден только тебе (демо)':'Публикация создана (демо)')}
function comment(id){if(!auth())return;const b=document.getElementById('comment-text')?.value.trim();if(!b){toast('Напиши комментарий');return}state.comments.push({post:id,author:'@demo.member',hidden:state.private,body:b});closeModal();render();toast('Комментарий отправлен (демо)')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});setMode(false);
</script></body></html>
