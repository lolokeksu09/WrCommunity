name: wrcommunity-local
x-environment: &environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3000
  APP_ORIGIN: http://localhost:8080
  DATABASE_URL: postgresql://wrcommunity:${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs}@postgres:5432/wrcommunity
  COOKIE_SECRET: ${COOKIE_SECRET:?Run node scripts/setup-local.mjs}
  LFG_CONTACT_KEY: ${LFG_CONTACT_KEY:?Run node scripts/setup-local.mjs}
  MEDIA_STORAGE_DIR: /app/media
  WEB_ROOT: /app/dist/web
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_SECURE: false
  SMTP_REQUIRE_TLS: false
  SMTP_FROM: WrCommunity Local <no-reply@example.invalid>
  WORKER_HEARTBEAT_FILE: /tmp/wrc-worker-heartbeat
x-app: &app
  image: wrcommunity:local
  build: .
  environment: *environment
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes: [media:/app/media]
  networks: [backend]
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: wrcommunity
      POSTGRES_DB: wrcommunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs}
    volumes: [postgres:/var/lib/postgresql]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wrcommunity -d wrcommunity']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ['127.0.0.1:8025:8025']
    networks: [backend, edge]
  migrate:
    <<: *app
    command: [node, dist/server/db/migrate.js]
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
  web-api:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: [node, dist/server/worker.js]
    healthcheck:
      test: [CMD, node, scripts/container-health.mjs, worker]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
  caddy:
    image: caddy:2.11.7-alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./Caddyfile.local:/etc/caddy/Caddyfile:ro']
    networks: [backend, edge]
    depends_on:
      web-api: {condition: service_healthy}
networks:
  edge: {}
  backend:
    internal: true
volumes:
  postgres: {}
  media: {}
