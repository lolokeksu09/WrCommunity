name: wrcommunity
x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  APP_ORIGIN: ${APP_ORIGIN:?Set the canonical HTTPS origin}
  TRUST_PROXY_CIDR: ${BACKEND_SUBNET:-172.30.60.0/24}
  DATABASE_URL: ${DATABASE_URL:?Set the private PostgreSQL connection URL}
  COOKIE_SECRET: ${COOKIE_SECRET:?Generate at least 32 random characters}
  LFG_CONTACT_KEY: ${LFG_CONTACT_KEY:?Generate 32 random bytes as 64 hex characters}
  MEDIA_DIR: /app/media
  MEDIA_STORAGE_DIR: /app/media
  SMTP_HOST: ${SMTP_HOST:?Set your SMTP provider host}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
  SMTP_USER: ${SMTP_USER:?Set SMTP username}
  SMTP_PASS: ${SMTP_PASS:?Set SMTP password}
  SMTP_FROM: ${SMTP_FROM:?Set a verified sender}
  WORKER_HEARTBEAT_FILE: /tmp/wrc-worker-heartbeat
x-app: &app
  image: wrcommunity:${APP_VERSION:-local}
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: *app-environment
  networks: [backend]
  volumes:
    - media:/app/media
services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wrcommunity}
      POSTGRES_DB: ${POSTGRES_DB:-wrcommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a database password}
    volumes:
      - postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [node, dist/server/db/migrate.js]
    healthcheck:
      disable: true
    depends_on:
      postgres: {condition: service_healthy}
  web-api:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: [node, dist/server/worker.js]
    networks: [backend, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, scripts/container-health.mjs, worker]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set the public DNS name}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on:
      web-api: {condition: service_healthy}
networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.60.0/24}
  edge: {}
  egress: {}
volumes:
  postgres: {}
  media: {}
  caddy_data: {}
  caddy_config: {}
